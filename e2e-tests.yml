name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows running the suite on demand or on a schedule (e.g. nightly
  # regression against the dev environment) without a code change.
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC daily

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BASE_URL: ${{ secrets.E2E_BASE_URL }}
      TEST_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npx playwright test

      - name: Lint
        if: always()
        run: npm run lint

      # Reports are uploaded even when tests fail - that's when they're
      # actually needed. `if: always()` ensures this runs regardless of
      # the previous step's outcome.
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: reports/junit-results.xml
          retention-days: 14

      - name: Publish test summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: E2E Test Results
          path: reports/junit-results.xml
          reporter: java-junit
          fail-on-error: false
